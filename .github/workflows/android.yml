name: Replica Studio Android APK
on:
  push:
    branches: [feature/replica-studio-4]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReplicaStudio-4.0-alpha1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
