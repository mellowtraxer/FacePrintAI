name: Deploy FacePrint AI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle MediaPipe locally
        run: |
          npm install --no-save --no-audit --no-fund @mediapipe/tasks-vision@1.2.3
          mkdir -p vendor/wasm
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs vendor/
          cp node_modules/@mediapipe/tasks-vision/wasm/* vendor/wasm/
          curl --fail --location --retry 3 --output vendor/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          test -s vendor/vision_bundle.mjs
          test -s vendor/face_landmarker.task
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
